#
# Domestic GPU estimate-only system profile.
# BR200 128-GPU supernode. No Silicon performance database is bundled.
# Unpublished microarchitectural fields use H100 proxies for KernelSim only;
# sm_version does not claim NVIDIA ISA compatibility.

data_dir: data/_dom_br200_128
gpu:
  mem_bw: 3200000000000 # 3.2TB/s
  mem_bw_empirical_scaling_factor: 0.8 # provisional generic correction
  mem_empirical_constant_latency: 0.000003 # 3us provisional estimate
  mem_capacity: 137438953472 # 128GiB
  bfloat16_tc_flops: 750000000000000 # 750TFLOPS BF16
  fp8_tc_flops: 1500000000000000 # 1500TFLOPS FP8
  power: 700 # provisional proxy; BR200 board power not provided
  sm_version: 90 # H100 proxy, not a BR200 ISA claim
  architecture_family: domestic
  capability_overrides:
    fp8_mma: true
    fp4_mma: false
    mnnvl: false
  sm_count: 132 # H100 proxy for analytical KernelSim
  clock_hz: 1830000000 # H100 proxy
  shared_memory_per_sm_bytes: 262144 # H100 proxy
  l2_capacity_bytes: 52428800 # H100 proxy
  l2_bandwidth_bytes_s: 9369600000000 # H100 proxy
  vector_peak_flops: 123724800000000 # H100 proxy

node:
  topology_scope: single_supernode
  num_gpus_per_node: 128 # BR200 supernode size
  inter_node_bw: 0 # cross-supernode link not modeled
  intra_node_bw: 400000000000 # 400GB/s per GPU within the supernode
  pcie_bw: 64000000000 # H100 proxy; BR200 host link not provided
  p2p_latency: 0.00001 # provisional H100 proxy

misc:
  nccl_mem:
    1: 0
    2: 358612992
    4: 411041792
    8: 411041792
  other_mem: 3758096384
  nccl_version: '2.27.3' # placeholder; no domestic collective backend data yet
