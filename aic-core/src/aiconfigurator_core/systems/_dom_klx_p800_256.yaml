#
# Domestic GPU estimate-only system profile.
# KLX-P800 compute, memory, and topology values come from the domestic GPU
# description updated on 2026-08-17. Unpublished microarchitectural fields are
# Ampere A100 proxies for KernelSim only, not ISA or backend compatibility claims.

data_dir: data/_dom_klx_p800_256
gpu:
  mem_bw: 2400000000000 # 2.4TB/s
  mem_bw_empirical_scaling_factor: 0.8 # provisional generic correction
  mem_empirical_constant_latency: 0.000003 # 3us provisional estimate
  mem_capacity: 103079215104 # 96GiB; source description says 96GB
  bfloat16_tc_flops: 345000000000000 # 345TFLOPS BF16
  power: 400 # A100 proxy; KLX-P800 board power not provided
  sm_version: 80 # A100 proxy, not a KLX ISA claim
  architecture_family: domestic
  capability_overrides:
    fp8_mma: false
    fp4_mma: false
    mnnvl: false
  sm_count: 108 # A100 SXM proxy for analytical KernelSim
  clock_hz: 1410000000 # A100 SXM boost-clock proxy
  shared_memory_per_sm_bytes: 196608 # A100 SM shared-memory capacity proxy
  l2_capacity_bytes: 41943040 # A100 40MiB L2 proxy
  l2_bandwidth_bytes_s: 5000000000000 # provisional A100-class L2 proxy
  vector_peak_flops: 38983680000000 # 108 SM * 1.41GHz * 256 ops/cycle proxy

node:
  topology_scope: single_supernode
  num_gpus_per_node: 256 # KLX-P800 supernode size
  inter_node_bw: 0 # cross-supernode link not modeled
  intra_node_bw: 200000000000 # 200GB/s per GPU within the supernode
  pcie_bw: 32000000000 # A100 PCIe 4.0 proxy; host link not provided
  p2p_latency: 0.00001 # provisional A100 proxy

misc:
  nccl_mem:
    1: 0
    2: 358612992
    4: 411041792
    8: 411041792
  other_mem: 3758096384
  nccl_version: '2.27.3' # placeholder; no domestic collective backend data yet
