#
# Domestic GPU estimate-only system profile.
# KLX-M300 chip parameters are unknown and are fully proxied from H200.
# No silicon performance database is bundled yet.

data_dir: data/_dom_klx_m300_512
gpu:
  mem_bw: 4800000000000 # 4.8TB/s, H200 proxy
  mem_bw_empirical_scaling_factor: 0.8 # provisional generic correction
  mem_empirical_constant_latency: 0.000003 # 3us provisional estimate
  mem_capacity: 151397597184 # 141GiB, H200 proxy
  bfloat16_tc_flops: 989000000000000 # 989TFLOPS, H200 proxy
  int8_tc_flops: 1978000000000000 # H200 proxy
  fp8_tc_flops: 1978000000000000 # H200 proxy
  power: 700 # H200 proxy
  sm_version: 90 # H200 proxy, not a KLX ISA claim
  architecture_family: domestic
  capability_overrides:
    fp8_mma: true
    fp4_mma: false
    mnnvl: false
  sm_count: 132 # H200 proxy for analytical kernelsim
  clock_hz: 1830000000 # H200 proxy
  shared_memory_per_sm_bytes: 262144 # H200 proxy
  l2_capacity_bytes: 52428800 # H200 proxy
  l2_bandwidth_bytes_s: 9369600000000 # H200 proxy
  vector_peak_flops: 123724800000000 # H200 proxy

node:
  topology_scope: single_supernode
  # Historical system ID retains the "512" suffix for compatibility, while
  # the source-of-truth topology is the 256-GPU KLX-M300 supernode.
  num_gpus_per_node: 256
  inter_node_bw: 0 # cross-supernode link not modeled
  intra_node_bw: 600000000000 # 600GB/s per GPU; updated 2026-08-17
  pcie_bw: 64000000000 # H200 proxy; KLX host link not provided
  p2p_latency: 0.00001 # provisional H200 proxy

misc:
  nccl_mem:
    1: 0
    2: 358612992
    4: 411041792
    8: 411041792
  other_mem: 3758096384
  nccl_version: '2.27.3' # placeholder; no domestic collective backend data yet
